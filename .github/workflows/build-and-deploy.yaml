name: Build and Deploy to Bunny CDN

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Trustpilot Reviews"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll Site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Gemfile.lock', 'gemset.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Build with Nix Flake
        run: nix build

      - name: Prepare site for upload
        run: |
          mkdir -p _site_output
          cp -r result/* _site_output/

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site_output/
          retention-days: 1

  deploy:
    name: Deploy to Bunny CDN
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: _site

      - name: Deploy to Bunny CDN
        uses: BunnyWay/actions/deploy-site@deploy-site_0.1.1
        with:
          site: blue-pits
          directory: _site
          api_key: ${{ secrets.BUNNY_ACCESS_KEY }}
          cli_version: "0.19"
          deployments: true

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    steps:
      - name: Send failure notification
        uses: NiNiyas/ntfy-action@master
        with:
          url: 'https://ntfy.sh'
          topic: ${{ secrets.NTFY_TOPIC }}