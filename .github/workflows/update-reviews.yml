name: Update Trustpilot Reviews

on:
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trustpilot-reviews
  cancel-in-progress: true

jobs:
  update-reviews:
    name: Fetch Trustpilot Reviews
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch reviews
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node scripts/fetch-trustpilot-reviews.js

      - name: Ensure only review data changed
        run: |
          unexpected="$(git status --porcelain | grep -vE '^.. _data/reviews.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes from the review importer:"
            echo "$unexpected"
            exit 1
          fi

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain _data/reviews.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/reviews.json
          git commit -m "Auto-update Trustpilot reviews"
          git push

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [update-reviews]
    if: failure()
    steps:
      - name: Send failure notification
        uses: NiNiyas/ntfy-action@master
        with:
          url: 'https://ntfy.sh'
          topic: ${{ secrets.NTFY_TOPIC }}
